<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JERATOU SHOP - Register</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <div class="logo">
                🎮 <span>JERATOU SHOP</span>
            </div>

            <div class="gold-line"></div>

            <h1>สมัครสมาชิก</h1>

            <p class="subtitle">
                สร้างบัญชีเพื่อเริ่มใช้งาน JERATOU SHOP
            </p>


            <!-- Message -->
            <div id="message" class="message"></div>


            <form id="registerForm">


                <!-- Username -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="ตั้ง Username"
                        required
                    >

                </div>
<!-- Email -->
                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="อย่างน้อย 6 ตัวอักษร"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="input-group">

                    <label for="confirmPassword">
                        ยืนยัน Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="กรอกรหัสผ่านอีกครั้ง"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Register Button -->
                <button type="submit" class="login-btn">
                    สมัครสมาชิก
                </button>

            </form>


            <div class="divider">
                <span>หรือ</span>
            </div>


            <p class="register-text">

                มีบัญชีอยู่แล้ว?

                <a href="login.html">
                    เข้าสู่ระบบ
                </a>

            </p>
<a href="index.html" class="back-home">
                ← กลับหน้าหลัก
            </a>

        </div>

    </div>


    <script src="register.js"></script>

</body>
</html>
